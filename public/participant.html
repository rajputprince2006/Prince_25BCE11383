<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Poll - PulseVote</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        /* PARTICIPANT HEADER */

        .participant-badge {
            text-align: center;

            color: #94a3b8;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 8px;
        }


        .participant-subtitle {
            text-align: center;

            margin-bottom: 30px;

            color: #cbd5e1;
        }


        /* ROOM INPUT */

        #roomCode {
            text-align: center;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* JOIN BUTTON */

        #joinForm button {
            margin-top: 5px;

            font-size: 16px;

            padding: 16px;
        }


        /* WAITING ROOM */

        #waitingSection {
            text-align: center;

            padding: 30px 20px;
        }


        .waiting-icon {
            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(124, 58, 237, 0.15);

            border:
                1px solid rgba(167, 139, 250, 0.3);

            font-size: 30px;
        }


        /* QUESTION */

        #question {
            text-align: center;

            line-height: 1.4;

            margin-bottom: 25px;
        }


        /* VOTING OPTIONS */

        #votingOptions {
            display: grid;

            grid-template-columns: 1fr;

            gap: 12px;
        }


        .vote-button {
            position: relative;

            text-align: left;

            padding: 18px;

            font-size: 16px;

            font-weight: 600;
        }


        .vote-button::before {
            content: "○";

            margin-right: 12px;

            color: #a78bfa;

            font-size: 18px;
        }


        .vote-button:disabled {
            opacity: 0.55;
        }


        /* VOTE MESSAGE */

        #voteMessage {
            padding: 14px;

            border-radius: 12px;

            background:
                rgba(124, 58, 237, 0.08);

            border:
                1px solid rgba(124, 58, 237, 0.15);
        }


        /* RESULTS */

        #resultsSection h2 {
            text-align: center;

            margin-bottom: 25px;
        }


        #participantTotalVotes {
            color: #a78bfa;

            font-size: 20px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .participant-subtitle {
                font-size: 14px;
            }

            #roomCode {
                font-size: 18px;
            }

            .vote-button {
                padding: 16px;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- JOIN SECTION -->

        <div id="joinSection">

            <div class="participant-badge">
                PARTICIPANT
            </div>


            <h1>
                Join Live Poll
            </h1>


            <p class="participant-subtitle">
                Enter the room code provided by the admin
                to participate in the live poll.
            </p>


            <form id="joinForm">


                <label for="roomCode">
                    Room Code
                </label>


                <input
                    type="text"
                    id="roomCode"
                    placeholder="ABC123"
                    maxlength="6"
                    autocomplete="off"
                    required
                >


                <button type="submit">
                    Join Poll
                </button>


            </form>

        </div>



        <!-- WAITING SECTION -->

        <div
            id="waitingSection"
            style="display: none;"
        >

            <div class="waiting-icon">
                ⏳
            </div>


            <h2>
                You're In!
            </h2>


            <p>
                Waiting for the admin to start
                the poll...
            </p>


            <p style="margin-top: 20px;">
                ROOM CODE
            </p>


            <h1 id="joinedRoomCode">
                ------
            </h1>


            <p>
                Keep this page open.
                Voting will begin automatically.
            </p>

        </div>



        <!-- VOTING SECTION -->

        <div
            id="votingSection"
            style="display: none;"
        >

            <div class="participant-badge">
                LIVE VOTING
            </div>


            <h2 id="question">
            </h2>


            <div id="votingOptions">
            </div>


            <p id="voteMessage">
            </p>

        </div>



        <!-- RESULTS SECTION -->

        <div
            id="resultsSection"
            style="display: none;"
        >

            <hr>


            <div class="participant-badge">
                LIVE RESULTS
            </div>


            <h2>
                Current Results
            </h2>


            <div id="participantResults">
            </div>


            <p
                style="
                    text-align: center;
                    margin-top: 25px;
                "
            >
                Total Votes:
                <strong id="participantTotalVotes">
                    0
                </strong>
            </p>

        </div>


    </div>


    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- PARTICIPANT JAVASCRIPT -->

    <script src="/participant.js"></script>


</body>

</html>
